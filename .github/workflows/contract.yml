name: contract

on:
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Fails loudly (non-zero exit) if the register's undocumented API
      # shape has moved. Do not add continue-on-error or swallow this.
      - run: npm run contract --workspace ingest
