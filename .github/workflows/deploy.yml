name: deploy

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [ingest]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent deployment, but don't cancel an in-progress run —
# let it finish so Pages never serves a half-built site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # data/normalised/ is gitignored, so votes.json does not exist in a
      # fresh checkout. This regenerates it from the committed data/raw/ and
      # data/snapshots/ caches — no network access, no live fetch.
      - run: npm run from-cache --workspace ingest

      - run: npm test --workspaces

      - run: npm run build --workspace site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
